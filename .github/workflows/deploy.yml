name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you deploy from a branch before merging: Actions tab → this workflow →
  # "Run workflow" → pick the branch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling
# it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `prebuild` vendors the OCR worker, WASM core and language model into
      # public/tesseract, so they ship with the site instead of being fetched
      # from a CDN at runtime.
      - run: npm run build

      # Requires Pages to already be switched on for the repository:
      # Settings → Pages → Source → GitHub Actions. That is a one-time manual
      # step and cannot be automated from here — `configure-pages` has an
      # `enablement: true` option, but creating a Pages site needs repository
      # admin rights, which a workflow's GITHUB_TOKEN does not have
      # ("Resource not accessible by integration"). Until it is enabled this
      # step fails with a 404 on "Get Pages site".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
