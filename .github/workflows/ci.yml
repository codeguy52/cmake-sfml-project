name: CI

on: [push, pull_request]

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Also exercises scripts/vendor-ocr-assets.mjs via the prebuild hook, so a
      # missing OCR asset fails here rather than in someone's browser.
      - name: Build
        run: npm run build

      # The linking backend is real code that the app build never touches, so
      # boot it against the mock provider and check it answers. Catches a
      # syntax error or a broken import before a deploy does.
      - name: Smoke-test the linking backend
        working-directory: server
        run: |
          npm ci
          PROVIDER=mock-personal ALLOWED_ORIGINS=http://localhost node src/server.js &
          for i in $(seq 1 20); do
            sleep 0.5
            if curl -sf -X POST http://127.0.0.1:8787/api/link/health \
                 -H 'Content-Type: application/json' -d '{}' -o health.json; then
              break
            fi
          done
          cat health.json
          grep -q '"mode":"personal"' health.json
          curl -sf -X POST http://127.0.0.1:8787/api/link/holdings \
            -H 'Content-Type: application/json' -d '{}' | grep -q 'snapshots'
