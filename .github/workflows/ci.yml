name: CI

on: [push, pull_request]

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Also exercises scripts/vendor-ocr-assets.mjs via the prebuild hook, so a
      # missing OCR asset fails here rather than in someone's browser.
      - name: Build
        run: npm run build
